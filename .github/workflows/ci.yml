name: ci

on:
  push:
  pull_request:

# A second push to the same branch makes the first run pointless, so drop it
# rather than pay for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml names the channel and the components, so rustup
      # only has to be told to obey it. Nothing here pins a version that could
      # drift away from the one the repo asks for.
      - name: Install the toolchain the repo asks for
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Formatting first. It is the cheapest to fix and the noisiest to leave.
      - run: cargo fmt --all -- --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test
