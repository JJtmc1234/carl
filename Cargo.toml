[package]
name = "carl"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "carl"
path = "src/lib.rs"

[[bin]]
name = "carl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
