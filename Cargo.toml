[package]
name = "carl"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[lib]
name = "carl"
path = "src/lib.rs"

[[bin]]
name = "carl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tungstenite = { version = "0.28", default-features = false, features = ["rustls-tls-webpki-roots", "handshake"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
tempfile = "3"
