# Carl's echo canceller.
#
# Run with:  pipewire -c /path/to/carl-aec.conf
#
# This is a second, small PipeWire process that connects to the running audio server as a
# client. It is deliberately not a change to the server's own config, because that needs a
# restart and a restart cuts everyone's audio. This can be started and killed at any time and
# nothing else on the machine notices.
#
# What it creates:
#
#   carl-speaker   a sink. Carl plays his voice into it, and it passes through to the real
#                  speakers. Because the canceller owns this sink, it knows exactly what
#                  sound is leaving the machine and when.
#   carl-mic       a source. The real microphone with that known sound subtracted out.
#
# That subtraction is the whole point. A speaker and a microphone in one room are a feedback
# loop, and the only way to break it without muting the mic is to know what the speaker is
# playing and remove it from what the mic hears. The audio server is the one component that
# knows both, which is why this lives here and not inside Carl.
#
# The result is that Carl can listen while he talks, so you can interrupt him.
#
# Note this cancels Carl's own voice, not game audio. Game audio goes to the default sink and
# the canceller never sees it. Routing everything through carl-speaker would cancel that too,
# at the cost of every sound on the machine depending on this process staying alive.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc

            # Small blocks. The canceller has to line up what was played against what was
            # heard, and a long block means a coarse alignment and a worse subtraction.
            node.latency = 512/48000

            # Passive, so these link themselves to whatever the real default device is
            # rather than naming a card that might not be plugged in.
            capture.props = {
                node.name    = "carl.aec.capture"
                node.passive = true
            }
            playback.props = {
                node.name    = "carl.aec.playback"
                node.passive = true
            }

            source.props = {
                node.name        = "carl-mic"
                node.description = "Carl mic, echo cancelled"
            }
            sink.props = {
                node.name        = "carl-speaker"
                node.description = "Carl speaker, echo cancelled"
            }

            aec.args = {
                # Gain control off. It rides the input level up and down, which is exactly
                # what breaks a threshold measured from the room once at startup.
                webrtc.gain_control      = false
                webrtc.extended_filter   = true
                webrtc.noise_suppression = true
                webrtc.high_pass_filter  = true
            }
        }
    }
]
