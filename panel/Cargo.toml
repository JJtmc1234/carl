[package]
name = "carl-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[[bin]]
name = "carl-panel"
path = "src/main.rs"

[lib]
name = "carl_panel"
path = "src/lib.rs"

[dependencies]
# The army types. The panel reads them and defines no second copy of any of them.
carl = { path = ".." }
# Chosen after checking the machine rather than by preference. Tauri needs webkit2gtk and
# gtk-rs needs the gtk dev packages, and none of those are installed or installable without
# sudo, which agents do not get. eframe is pure Rust and needs nothing added to the system.
# `default_fonts` is the important one and it was missing.
#
# With `default-features = false` it is easy to lose, and losing it means egui has no fonts at
# all. Every shape still draws, so the panel came up with correct colours, borders, status pips
# and hairlines, and not one glyph. It looked exactly like black text on a black background and
# it was nothing of the sort: there was no text. Two renderers were blamed before the manifest
# was.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[features]
# The other renderer, for a machine where OpenGL is genuinely the problem. It was not the
# problem here, and glow stays the default because it is the smaller dependency.
wgpu = ["eframe/wgpu"]
